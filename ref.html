<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d9488">
<title>Fast LINKS | Full Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f6; --bg-grad-b:#e4ecf5;
    --surface:#ffffff; --surface-2:#f8fafc;
    --text:#0f172a; --text-muted:#64748b; --text-faint:#94a3b8;
    --border:#e6ebf1;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md:0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
    --radius-lg:20px; --radius-md:14px;
    --brand-1:#0891b2; --brand-2:#0d9488;
    --opd-c:#2563eb; --opd-bg:#eff6ff;
    --ipd-c:#dc2626; --ipd-bg:#fef2f2;
    --both-c:#d97706; --both-bg:#fffbeb;
    --af-c:#6d28d9; --af-bg:#ede9fe;
    --av-c:#0e7490; --av-bg:#cffafe;
    --drugscom-c:#2563eb; 
    --mims-c:#059669; /* Green tone for MIMS */
  }
  [data-theme="dark"]{
    --bg:#0b1220; --bg-grad-b:#111a2c;
    --surface:#161f32; --surface-2:#1c273d;
    --text:#e8edf5; --text-muted:#9aa8c0; --text-faint:#6b7a95;
    --border:#26314a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 6px 16px rgba(0,0,0,.35);
    --opd-bg:rgba(37,99,235,.16); --ipd-bg:rgba(220,38,38,.16); --both-bg:rgba(217,119,6,.16);
    --af-bg:rgba(109,40,217,.18); --av-bg:rgba(14,116,144,.18);
    --drugscom-c:#3b82f6;
    --mims-c:#10b981;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:'Prompt','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-grad-b) 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, var(--bg-grad-b) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); transition:background .3s,color .3s;
    min-height:100vh; padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:30;
    padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
    background:linear-gradient(135deg,var(--brand-1),var(--brand-2));
    box-shadow:0 6px 24px rgba(8,145,178,.25);
    border-radius:0 0 24px 24px;
  }
  .header-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .header-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .back-btn{
    flex-shrink:0; width:40px; height:40px; border-radius:12px;
    background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3);
    color:#fff; font-size:1.25rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.2s;
    text-decoration:none;
  }
  .back-btn:active{transform:scale(.9);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-icon{
    width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; font-size:1.25rem; flex-shrink:0;
  }
  .brand h1{color:#fff; font-size:1.02rem; font-weight:700; margin:0;}
  .brand p{color:rgba(255,255,255,.85); font-size:.68rem; margin:1px 0 0; font-weight:400;}
  .theme-btn{
    background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:12px;
    width:40px; height:40px; font-size:1.1rem; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:.2s;
  }
  .theme-btn:active{transform:scale(.9);}
  .search-wrap{position:relative;}
  .search-wrap .icon-prefix{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1rem; opacity:.5;}
  .search-wrap input{
    width:100%; padding:13px 40px 13px 40px; border-radius:16px; border:none;
    font-family:inherit; font-size:.9rem; outline:none; background:rgba(255,255,255,.96); color:#0f172a;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .search-wrap input::placeholder{color:#94a3b8;}
  .search-wrap .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:#e2e8f0; border:none; width:24px; height:24px; border-radius:50%; font-size:.85rem;
    color:#64748b; cursor:pointer; display:none; align-items:center; justify-content:center;
  }

  /* ===== Action Buttons ===== */
  .action-btn-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.18); color:#fff; font-family:inherit; font-size:.8rem;
    font-weight:600; cursor:pointer; transition:.18s; white-space:nowrap;
  }
  .action-btn:active{transform:scale(.95);}
  .action-btn.on{background:#fbbf24; border-color:#fbbf24; color:#78350f;}
  .action-btn.ref-drugscom{background:var(--drugscom-c); border-color:var(--drugscom-c); color:#fff;} 
  .action-btn.ref-mims{background:var(--mims-c); border-color:var(--mims-c); color:#fff;} 
  
  .fav-star{
    flex-shrink:0; background:none; border:none; font-size:1.15rem; cursor:pointer;
    padding:2px 4px; line-height:1; transition:.15s; color:#cbd5e1;
  }
  .fav-star.active{color:#f59e0b;}
  .fav-star:active{transform:scale(1.3);}
  .right-actions{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  #printTitle{display:none;}

  main{max-width:1200px; margin:0 auto; padding:18px 16px 0;}

  .category-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:16px;}
  .cat-btn{
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md);
    padding:13px 6px 11px; cursor:pointer; text-align:center; box-shadow:var(--shadow-sm);
    transition:.18s ease; color:var(--text);
  }
  .cat-btn:active{transform:scale(.96);}
  .cat-btn .icon-circle{
    width:38px; height:38px; margin:0 auto 6px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:1.15rem; background:var(--surface-2); transition:.2s;
  }
  .cat-btn .label{font-size:.71rem; font-weight:600; display:block; line-height:1.25;}
  .cat-btn .count-badge{font-size:.6rem; font-weight:500; color:var(--text-faint); margin-top:2px; display:block;}
  .cat-btn.active{box-shadow:var(--shadow-md); transform:translateY(-2px);}

  .subset-row{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none;
    mask-image:linear-gradient(90deg,#000 92%,transparent);
  }
  .subset-row::-webkit-scrollbar{display:none;}
  .subset-chip{
    flex-shrink:0; padding:8px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); font-size:.79rem; cursor:pointer; white-space:nowrap;
    font-weight:500; font-family:inherit; transition:.18s; box-shadow:var(--shadow-sm);
  }
  .result-meta{display:flex; justify-content:space-between; align-items:center; margin:2px 0 14px; color:var(--text-muted); font-size:.8rem; font-weight:500;}
  .result-meta .count-pill{background:var(--surface-2); padding:4px 12px; border-radius:999px; font-weight:600; color:var(--text);}

  .drug-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px;}
  .drug-card{
    background:var(--surface); border-radius:var(--radius-md); padding:15px;
    box-shadow:var(--shadow-sm); border:1px solid var(--border);
    border-top:3px solid var(--card-accent,#0d9488);
    transition:.2s ease; animation:fadeUp .3s ease backwards;
  }
  .drug-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:9px;}
  .card-top-left{flex:1; min-width:0;}
  .card-top h3{margin:0 0 5px; font-size:.96rem; font-weight:700; line-height:1.3; word-wrap:break-word;}
  
  .badge-row{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .tag{display:inline-block; font-size:.65rem; padding:3px 8px; border-radius:7px; background:var(--surface-2); color:var(--text-muted); font-weight:600;}
  .setting-badge{font-size:.62rem; padding:3px 8px; border-radius:7px; font-weight:700;}
  .setting-badge.opd{background:var(--opd-bg); color:var(--opd-c);}
  .setting-badge.ipd{background:var(--ipd-bg); color:var(--ipd-c);}
  .setting-badge.both{background:var(--both-bg); color:var(--both-c);}
  .setting-badge.antifungal{background:var(--af-bg); color:var(--af-c);}
  .setting-badge.antiviral{background:var(--av-bg); color:var(--av-c);}
  
  /* Link Button Styles */
  .ud-btn{
    flex-shrink:0; background:var(--surface-2); color:var(--brand-2); border:1.5px solid var(--brand-2);
    border-radius:10px; padding:7px 10px; font-size:.68rem; font-weight:700; cursor:pointer;
    white-space:nowrap; font-family:inherit; display:flex; align-items:center; gap:4px; transition:.18s;
  }
  .ud-btn:hover{background:var(--brand-2); color:#fff;}
  .ud-btn:active{transform:scale(.94);}
  
  .ud-btn.drugscom-mode{ color:var(--drugscom-c); border-color:var(--drugscom-c); }
  .ud-btn.drugscom-mode:hover{ background:var(--drugscom-c); color:#fff; }

  .ud-btn.mims-mode{ color:var(--mims-c); border-color:var(--mims-c); }
  .ud-btn.mims-mode:hover{ background:var(--mims-c); color:#fff; }

  .divider{height:1px; background:var(--border); margin:9px 0;}
  .info-row{display:flex; gap:7px; margin:7px 0; align-items:flex-start;}
  .info-row .info-icon{font-size:.85rem; flex-shrink:0; margin-top:1px; opacity:.7;}
  .info-row .info-text{flex:1;}
  .info-row .info-label{font-size:.64rem; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:2px;}
  .info-row .info-value{font-size:.82rem; line-height:1.4; color:var(--text);}

  .empty-state{text-align:center; padding:56px 24px; color:var(--text-muted); background:var(--surface); border-radius:var(--radius-lg); border:1px dashed var(--border);}
  .empty-state .big-icon{font-size:2.6rem; display:block; margin-bottom:12px; opacity:.6;}
  .empty-state p{font-size:.85rem; margin:0; line-height:1.6;}

  footer{max-width:1200px; margin:26px auto 0; padding:16px 20px; color:var(--text-faint); font-size:.7rem; text-align:center; line-height:1.6; border-top:1px solid var(--border);}

  @media(min-width:640px){
    .category-grid{grid-template-columns:repeat(5,1fr); gap:12px;}
    .cat-btn .icon-circle{width:44px; height:44px; font-size:1.3rem;}
    .cat-btn .label{font-size:.76rem;}
  }
  @media(min-width:1024px){ .category-grid{grid-template-columns:repeat(9,1fr);} }
  @media(max-width:380px){ 
    .drug-list{grid-template-columns:1fr;} 
    .action-btn{flex: 1 1 30%;}
  }

  @media print{
    header, .category-grid, .subset-row, .result-meta, footer, .action-btn-row, .fav-star, .ud-btn{display:none !important;}
    body{background:#fff !important; padding:0;}
    main{max-width:100%; padding:0;}
    .drug-list{display:block !important;}
    .drug-card{
      box-shadow:none !important; border:1px solid #ccc !important;
      border-top:3px solid var(--card-accent,#0d9488) !important;
      break-inside:avoid; page-break-inside:avoid; margin-bottom:10px;
    }
    .drug-card:hover{transform:none !important;}
    #printTitle{display:block !important; text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:16px; color:#0f172a;}
  }
</style>
</head>

<header>
  <div class="header-top">
    <div class="header-left">

</header>

<main>

</footer>

// ==================== FAVORITES ====================
let favorites = JSON.parse(localStorage.getItem("favDrugs") || "[]");
let showFavoritesOnly = false;

function isFavorite(name){ return favorites.includes(name); }
function toggleFavorite(name){
  favorites = isFavorite(name) ? favorites.filter(n=>n!==name) : [...favorites, name];
  localStorage.setItem("favDrugs", JSON.stringify(favorites));
  updateFavCount();
  renderResults();
}
function updateFavCount(){
  const el = document.getElementById("favCount");
  if(el) el.textContent = favorites.length;
}

let activeCategory=null, activeSubset="all", searchTerm="";
let currentRef = "uptodate"; // Default Reference (uptodate -> drugscom -> mims -> uptodate)

// ==================== HELPERS ====================
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function countInCategory(k){return drugData.filter(d=>d.category===k).length;}

function settingBadgeHTML(d){
  if(d.category!=="abx") return "";
  if(d.type==="antifungal") return '<span class="setting-badge antifungal">Antifungal</span>';
  if(d.type==="antiviral") return '<span class="setting-badge antiviral">Antiviral</span>';
  const map={opd:"OPD",ipd:"IPD",both:"OPD+IPD"};
  return d.setting ? '<span class="setting-badge '+d.setting+'">'+map[d.setting]+'</span>' : "";
}

// Generate Reference Link based on current mode (UpToDate, Drugs.com, MIMS)
function getRefLink(name){
  const clean = name.split("(")[0].trim();
  if (currentRef === "drugscom") {
    const formatted = clean.toLowerCase().replace(/[\s\/]+/g, '-');
    return "https://www.drugs.com/dosage/" + formatted + ".html#Renal_Dose_Adjustments";
  } else if (currentRef === "mims") {
    const formattedMims = clean.toLowerCase().replace(/[\s\/]+/g, '-');
    return "https://www.mims.com/thailand/drug/info/" + formattedMims;
  }
  return "https://www.uptodate.com/contents/search?search=" + encodeURIComponent(clean);
}

// ==================== RENDER: CATEGORY BUTTONS ====================
function renderCategoryButtons(){
  const grid=document.getElementById("categoryGrid");
  grid.innerHTML="";
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  Object.keys(categoryMeta).forEach(key=>{
    const meta=categoryMeta[key];
    const btn=document.createElement("button");
    btn.className="cat-btn"+(activeCategory===key?" active":"");
    btn.innerHTML='<div class="icon-circle">'+meta.icon+'</div><span class="label">'+meta.label+'</span><span class="count-badge">'+countInCategory(key)+' รายการ</span>';
    if(activeCategory===key){
      btn.style.borderColor=meta.color;
      btn.style.background=hexToRgba(meta.color,isDark?0.18:0.08);
      btn.querySelector(".icon-circle").style.background=meta.color;
      btn.querySelector(".icon-circle").style.color="#fff";
    }
    btn.onclick=()=>{
      activeCategory=(activeCategory===key)?null:key;
      activeSubset="all"; searchTerm="";
      showFavoritesOnly=false;
      document.getElementById("favToggleBtn").classList.remove("on");
      document.getElementById("searchInput").value="";
      document.getElementById("clearSearch").style.display="none";
      renderCategoryButtons(); renderSubsetChips(); renderResults();
    };
    grid.appendChild(btn);
  });
}

// ==================== RENDER: SUBSET CHIPS ====================
function renderSubsetChips(){
  const row=document.getElementById("subsetRow");
  row.innerHTML="";
  if(!activeCategory){row.style.display="none";return;}
  row.style.display="flex";
  const meta=categoryMeta[activeCategory];
  meta.subsets.forEach(s=>{
    const chip=document.createElement("button");
    chip.className="subset-chip"+(activeSubset===s.key?" active":"");
    chip.textContent=s.label;
    if(activeSubset===s.key){chip.style.background=meta.color;chip.style.borderColor=meta.color;chip.style.color="#fff";}
    chip.onclick=()=>{activeSubset=s.key;renderSubsetChips();renderResults();};
    row.appendChild(chip);
  });
}

// ==================== FILTER LOGIC ====================
function filterDrugs(){
  if(showFavoritesOnly){
    let list = drugData.filter(d => favorites.includes(d.name));
    if(searchTerm.trim().length>0){
      const t = searchTerm.trim().toLowerCase();
      list = list.filter(d => d.name.toLowerCase().includes(t) || d.class.toLowerCase().includes(t));
    }
    return list;
  }
  if(searchTerm.trim().length>0){
    const t=searchTerm.trim().toLowerCase();
    return drugData.filter(d=>d.name.toLowerCase().includes(t)||d.class.toLowerCase().includes(t));
  }
  if(!activeCategory) return [];
  let list=drugData.filter(d=>d.category===activeCategory);
  if(activeCategory==="abx"){
    if(activeSubset==="opd") list=list.filter(d=>d.type==="antibacterial"&&(d.setting==="opd"||d.setting==="both"));
    else if(activeSubset==="ipd") list=list.filter(d=>d.type==="antibacterial"&&(d.setting==="ipd"||d.setting==="both"));
    else if(activeSubset==="antifungal") list=list.filter(d=>d.type==="antifungal");
    else if(activeSubset==="antiviral") list=list.filter(d=>d.type==="antiviral");
  } else if(activeSubset!=="all"){
    list=list.filter(d=>d.subset && d.subset.includes(activeSubset));
  }
  return list;
}

// ==================== RENDER: RESULTS ====================
function renderResults(){
  const container=document.getElementById("drugList");
  const countEl=document.getElementById("resultCount");
  const printTitleEl=document.getElementById("printTitle");

  if(showFavoritesOnly && favorites.length===0){
    countEl.textContent="ยังไม่มียาโปรด";
    printTitleEl.textContent="";
    container.innerHTML='<div class="empty-state"><span class="big-icon">⭐</span><p>กดไอคอนดาวที่การ์ดยาเพื่อบันทึกเป็นยาโปรด<br>จะแสดงรวมไว้ที่นี่สำหรับเรียกดูเร็ว ๆ ครั้งต่อไป</p></div>';
    return;
  }

  const results=filterDrugs().sort((a,b)=>a.name.localeCompare(b.name));

  if(searchTerm.trim().length===0 && !activeCategory && !showFavoritesOnly){
    countEl.textContent="เลือกกลุ่มยา หรือค้นหาชื่อยาด้านบน";
    printTitleEl.textContent="";
    container.innerHTML='<div class="empty-state"><span class="big-icon">🩺</span><p>เลือกกลุ่มยาด้านบน หรือพิมพ์ชื่อยาที่ช่องค้นหา<br>เพื่อเริ่มตรวจสอบขนาดยา</p></div>';
    return;
  }

  countEl.innerHTML='<span class="count-pill">พบ '+results.length+' รายการ</span>';
  printTitleEl.textContent = showFavoritesOnly
    ? "📋 รายการยาโปรด (Favorites)"
    : (activeCategory ? "📋 " + categoryMeta[activeCategory].label : "📋 ผลการค้นหา: " + searchTerm);

  if(results.length===0){
    container.innerHTML='<div class="empty-state"><span class="big-icon">😕</span><p>ไม่พบยาที่ตรงกับเงื่อนไขค้นหา</p></div>';
    return;
  }
  container.innerHTML="";
  
  // Set up Reference Display Text and Style Class
  let refText = "UpToDate";
  let refClass = "";
  if (currentRef === "drugscom") {
    refText = "Drugs.com";
    refClass = " drugscom-mode";
  } else if (currentRef === "mims") {
    refText = "MIMS Thailand";
    refClass = " mims-mode";
  }

  results.forEach((d,i)=>{
    const accent=categoryMeta[d.category].color;
    const card=document.createElement("div");
    card.className="drug-card";
    card.style.animationDelay=(i*0.02)+"s";
    card.style.setProperty("--card-accent",accent);
    card.innerHTML=
      '<div class="card-top">'+
        '<div class="card-top-left">'+
          '<h3>'+d.name+'</h3>'+
          '<div class="badge-row"><span class="tag">'+d.class+'</span>'+settingBadgeHTML(d)+'</div>'+
        '</div>'+
        '<div class="right-actions">'+
          '<button class="fav-star'+(isFavorite(d.name)?' active':'')+'" title="บันทึกเป็นยาโปรด">'+(isFavorite(d.name)?'⭐':'☆')+'</button>'+
          '<button class="ud-btn' + refClass + '">🔗 ' + refText + '</button>'+
        '</div>'+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="info-row"><span class="info-icon">💊</span><div class="info-text"><span class="info-label">Max Dose</span><span class="info-value">'+d.maxDose+'</span></div></div>'+
      '<div class="info-row"><span class="info-icon">🧪</span><div class="info-text"><span class="info-label">Renal Adjustment</span><span class="info-value">'+d.renal+'</span></div></div>';
    card.querySelector(".ud-btn").addEventListener("click",()=>window.open(getRefLink(d.name),"_blank"));
    card.querySelector(".fav-star").addEventListener("click",()=>toggleFavorite(d.name));
    container.appendChild(card);
  });
}

// ==================== SEARCH ====================
const searchInput=document.getElementById("searchInput");
const clearBtn=document.getElementById("clearSearch");
searchInput.addEventListener("input",e=>{searchTerm=e.target.value;clearBtn.style.display=searchTerm?"flex":"none";renderResults();});
clearBtn.addEventListener("click",()=>{searchTerm="";searchInput.value="";clearBtn.style.display="none";renderResults();});

// ==================== ACTION BUTTONS (FAV, EXPORT, REF) ====================
document.getElementById("favToggleBtn").addEventListener("click", ()=>{
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById("favToggleBtn").classList.toggle("on", showFavoritesOnly);
  if(showFavoritesOnly){
    activeCategory = null;
    renderCategoryButtons();
    renderSubsetChips();
  }
  renderResults();
});
document.getElementById("exportPdfBtn").addEventListener("click", ()=>{
  window.print();
});

function saveState() {
  sessionStorage.setItem("appState", JSON.stringify({
    activeCategory,
    activeSubset,
    searchTerm,
    currentRef,
    showFavoritesOnly
  }));
}

const savedState = sessionStorage.getItem("appState");
if (savedState) {
  const state = JSON.parse(savedState);
  activeCategory = state.activeCategory;
  activeSubset = state.activeSubset;
  searchTerm = state.searchTerm;
  currentRef = state.currentRef || "uptodate";
  showFavoritesOnly = state.showFavoritesOnly || false;

  // คืนค่า UI ของช่องค้นหา
  if (searchTerm) {
    document.getElementById("searchInput").value = searchTerm;
    document.getElementById("clearSearch").style.display = "flex";
  }
  if (showFavoritesOnly) {
    document.getElementById("favToggleBtn").classList.add("on");
  }
}

const refToggleBtn = document.getElementById("refToggleBtn");
function updateRefUI() {
  refToggleBtn.classList.remove("ref-drugscom", "ref-mims");
  if (currentRef === "uptodate") {
    refToggleBtn.innerHTML = "📚 REF: UpToDate";
  } else if (currentRef === "drugscom") {
    refToggleBtn.innerHTML = "📚 REF: Drugs.com";
    refToggleBtn.classList.add("ref-drugscom");
  } else if (currentRef === "mims") {
    refToggleBtn.innerHTML = "📚 REF: MIMS";
    refToggleBtn.classList.add("ref-mims");
  }
  renderResults(); 
}
refToggleBtn.addEventListener("click", () => {
  if (currentRef === "uptodate") {
    currentRef = "drugscom";
  } else if (currentRef === "drugscom") {
    currentRef = "mims";
  } else {
    currentRef = "uptodate";
  }
  updateRefUI();
});

// ==================== BACK TO INDEX ====================
document.getElementById("backToIndex").addEventListener("click",()=>{ window.location.href="index.html"; });

// ==================== THEME TOGGLE ====================
const themeToggle=document.getElementById("themeToggle");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  themeToggle.textContent=t==="dark"?"☀️":"🌙";
  document.querySelector('meta[name="theme-color"]').setAttribute("content",t==="dark"?"#0b1220":"#0d9488");
  localStorage.setItem("doseToolTheme",t);
  renderCategoryButtons(); renderSubsetChips();
}
themeToggle.addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");applyTheme(c==="dark"?"light":"dark");});
applyTheme(localStorage.getItem("doseToolTheme")||(window.matchMedia('(prefers-color-scheme: dark)').matches?"dark":"light"));

// ==================== INIT ====================
updateFavCount();
updateRefUI();
renderCategoryButtons(); renderSubsetChips(); renderResults();
</script>
