<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Dose Screening | Point-of-Care Tool</title>
<style>
  :root{
    --bg:#f1f5f9; --card-bg:#ffffff; --text:#1e293b; --text-muted:#64748b;
    --border:#e2e8f0; --chip-bg:#f8fafc; --shadow:0 1px 3px rgba(0,0,0,.08);
    --accent-cv:#e11d48; --accent-endo:#8b5cf6; --accent-abx:#0d9488;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card-bg:#1e293b; --text:#e2e8f0; --text-muted:#94a3b8;
    --border:#334155; --chip-bg:#273449; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
    background:var(--bg); color:var(--text); transition:background .2s,color .2s; padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,#0ea5e9,#0d9488);
    padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .header-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .header-top h1{color:#fff; font-size:1.15rem; margin:0; display:flex; align-items:center; gap:8px;}
  .header-top p{color:#e0f2fe; font-size:.72rem; margin:2px 0 0; font-weight:400;}
  .theme-btn{
    background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:50%;
    width:38px; height:38px; font-size:1.1rem; cursor:pointer; flex-shrink:0;
  }
  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%; padding:12px 40px 12px 14px; border-radius:12px; border:none;
    font-size:1rem; outline:none; background:#fff; color:#1e293b;
  }
  .search-wrap .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; font-size:1.1rem; color:#94a3b8; cursor:pointer; display:none;
  }
  main{max-width:900px; margin:0 auto; padding:16px;}

  .category-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .cat-btn{
    background:var(--card-bg); border:2px solid var(--border); border-radius:14px;
    padding:14px 8px; cursor:pointer; text-align:center; box-shadow:var(--shadow);
    transition:.15s; color:var(--text);
  }
  .cat-btn .icon{font-size:1.6rem; display:block; margin-bottom:4px;}
  .cat-btn .label{font-size:.82rem; font-weight:600; display:block;}
  .cat-btn.active[data-cat="cv"]{border-color:var(--accent-cv); background:rgba(225,29,72,.08);}
  .cat-btn.active[data-cat="endo"]{border-color:var(--accent-endo); background:rgba(139,92,246,.08);}
  .cat-btn.active[data-cat="abx"]{border-color:var(--accent-abx); background:rgba(13,148,136,.08);}

  .subset-row{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:thin;
  }
  .subset-chip{
    flex-shrink:0; padding:8px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--chip-bg); color:var(--text); font-size:.82rem; cursor:pointer; white-space:nowrap;
    font-weight:500; transition:.15s;
  }
  .subset-chip.active{background:#0d9488; color:#fff; border-color:#0d9488;}

  .result-meta{display:flex; justify-content:space-between; align-items:center; margin:6px 0 12px; color:var(--text-muted); font-size:.82rem;}

  .drug-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px;}
  .drug-card{
    background:var(--card-bg); border-radius:14px; padding:14px; box-shadow:var(--shadow);
    border-left:5px solid var(--card-accent,#0d9488);
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
  .card-top h3{margin:0 0 4px; font-size:1rem;}
  .tag{
    display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:6px;
    background:var(--chip-bg); color:var(--text-muted); font-weight:600;
  }
  .setting-badge{font-size:.65rem; padding:2px 6px; border-radius:5px; margin-left:4px; font-weight:700;}
  .setting-badge.opd{background:#dbeafe; color:#1e40af;}
  .setting-badge.ipd{background:#fee2e2; color:#991b1b;}
  .setting-badge.both{background:#fef3c7; color:#92400e;}
  .ud-btn{
    flex-shrink:0; background:#0d9488; color:#fff; border:none; border-radius:8px;
    padding:8px 10px; font-size:.75rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .ud-btn:hover{background:#0f766e;}
  .card-body p{margin:6px 0; font-size:.85rem; line-height:1.4;}
  .card-body strong{color:var(--text); font-size:.8rem;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--text-muted);}
  .empty-state .big-icon{font-size:2.5rem; display:block; margin-bottom:8px;}

  footer{max-width:900px; margin:20px auto 0; padding:12px 16px; color:var(--text-muted); font-size:.72rem; text-align:center; line-height:1.5;}

  @media(max-width:480px){
    .category-grid{gap:8px;}
    .cat-btn{padding:10px 4px;}
    .cat-btn .icon{font-size:1.3rem;}
    .cat-btn .label{font-size:.72rem;}
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>⚡ Fast Dose Screening</h1>
    <button class="theme-btn" id="themeToggle" title="สลับธีม">🌙</button>
  </div>
  <p>คัดกรองขนาดยาเบื้องต้น + เปิด UpToDate ตรวจสอบได้ทันที</p>
  <div class="search-wrap" style="margin-top:10px;">
    <input type="text" id="searchInput" placeholder="🔍 พิมพ์ชื่อยาเพื่อค้นหาทันที เช่น Enalapril, Ceftriaxone...">
    <button class="clear-btn" id="clearSearch">✕</button>
  </div>
</header>

<main>
  <div class="category-grid" id="categoryGrid"></div>
  <div class="subset-row" id="subsetRow"></div>
  <div class="result-meta">
    <span id="resultCount">เลือกกลุ่มยา หรือค้นหาชื่อยาด้านบน</span>
  </div>
  <div class="drug-list" id="drugList"></div>
</main>

<footer>
  ⚠️ ข้อมูลนี้จัดทำเพื่อการคัดกรองเบื้องต้นหน้างานเท่านั้น กรุณายืนยันความถูกต้อง/ปรับตามผู้ป่วยรายบุคคลผ่าน UpToDate หรือแหล่งอ้างอิงมาตรฐานก่อนใช้ทางคลินิกจริงเสมอ
</footer>

{name:"Piperacillin-Tazobactam", class:"Extended-spectrum penicillin/BLI", category:"abx", setting:"ipd", maxDose:"18/2.25 g/day (4.5 g q6h)", renal:"CrCl 20-40: 3.375 g q6h; CrCl <20: 2.25 g q6h"},
{name:"Meropenem", class:"Carbapenem", category:"abx", setting:"ipd", maxDose:"6000 mg/day (2 g q8h สำหรับ meningitis)", renal:"CrCl 26-50: q12h; CrCl 10-25: 50%dose q12h; CrCl <10: 50%dose q24h"},
{name:"Vancomycin (IV)", class:"Glycopeptide", category:"abx", setting:"ipd", maxDose:"15-20 mg/kg q8-12h (ปรับตาม trough)", renal:"ปรับขนาด/ระยะห่างตามไตอย่างมีนัยสำคัญ + ติดตามระดับยา"},
{name:"Amikacin", class:"Aminoglycoside", category:"abx", setting:"ipd", maxDose:"15 mg/kg/day", renal:"ปรับตามระดับยาในเลือดและ CrCl"},
{name:"Gentamicin", class:"Aminoglycoside", category:"abx", setting:"ipd", maxDose:"5-7 mg/kg/day (extended-interval)", renal:"เพิ่มระยะห่างมื้อยาตาม CrCl + ติดตามระดับยา"},
{name:"Colistin", class:"Polymyxin", category:"abx", setting:"ipd", maxDose:"ตามน้ำหนักตัว (loading + maintenance ตาม CrCl)", renal:"ปรับขนาดตาม CrCl อย่างมีนัยสำคัญ"},
{name:"Clindamycin (IV)", class:"Lincosamide", category:"abx", setting:"ipd", maxDose:"4800 mg/day (600-900 mg q8h)", renal:"ไม่จำเป็นต้องปรับขนาด"}
];

// ==================== STATE ====================
let activeCategory = null;
let activeSubset = "all";
let searchTerm = "";

// ==================== HELPERS ====================
function getUpToDateLink(drugName){
  const cleanName = drugName.split("(")[0].trim();
  return "https://www.uptodate.com/contents/search?search=" + encodeURIComponent(cleanName);
}

function settingBadgeHTML(setting){
  if(!setting) return "";
  const map = {opd:"OPD", ipd:"IPD", both:"OPD+IPD"};
  return '<span class="setting-badge ' + setting + '">' + map[setting] + '</span>';
}

// ==================== RENDER: CATEGORY BUTTONS ====================
function renderCategoryButtons(){
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  Object.keys(categoryMeta).forEach(key=>{
    const meta = categoryMeta[key];
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (activeCategory===key ? " active" : "");
    btn.dataset.cat = key;
    btn.innerHTML = '<span class="icon">'+meta.icon+'</span><span class="label">'+meta.label+'</span>';
    btn.onclick = ()=>{
      activeCategory = (activeCategory===key) ? null : key;
      activeSubset = "all";
      searchTerm = "";
      document.getElementById("searchInput").value = "";
      renderCategoryButtons();
      renderSubsetChips();
      renderResults();
    };
    grid.appendChild(btn);
  });
}

// ==================== RENDER: SUBSET CHIPS ====================
function renderSubsetChips(){
  const row = document.getElementById("subsetRow");
  row.innerHTML = "";
  if(!activeCategory){ row.style.display="none"; return; }
  row.style.display="flex";
  categoryMeta[activeCategory].subsets.forEach(s=>{
    const chip = document.createElement("button");
    chip.className = "subset-chip" + (activeSubset===s.key ? " active" : "");
    chip.textContent = s.label;
    chip.onclick = ()=>{
      activeSubset = s.key;
      renderSubsetChips();
      renderResults();
    };
    row.appendChild(chip);
  });
}

// ==================== FILTER LOGIC ====================
function filterDrugs(){
  if(searchTerm.trim().length > 0){
    const term = searchTerm.trim().toLowerCase();
    return drugData.filter(d =>
      d.name.toLowerCase().includes(term) || d.class.toLowerCase().includes(term)
    );
  }
  if(!activeCategory) return [];
  let list = drugData.filter(d => d.category === activeCategory);
  if(activeCategory === "abx"){
    if(activeSubset !== "all"){
      list = list.filter(d => d.setting === activeSubset || d.setting === "both");
    }
  } else {
    if(activeSubset !== "all"){
      list = list.filter(d => d.subset.includes(activeSubset));
    }
  }
  return list;
}

// ==================== RENDER: RESULTS ====================
function renderResults(){
  const container = document.getElementById("drugList");
  const countEl = document.getElementById("resultCount");
  const results = filterDrugs().sort((a,b)=>a.name.localeCompare(b.name));

  if(searchTerm.trim().length === 0 && !activeCategory){
    countEl.textContent = "เลือกกลุ่มยา หรือค้นหาชื่อยาด้านบน";
    container.innerHTML = '<div class="empty-state"><span class="big-icon">🔍</span>เลือกกลุ่มยาด้านบน หรือพิมพ์ชื่อยาที่ช่องค้นหาเพื่อเริ่มต้น</div>';
    return;
  }

  countEl.textContent = "พบ " + results.length + " รายการ";

  if(results.length === 0){
    container.innerHTML = '<div class="empty-state"><span class="big-icon">😕</span>ไม่พบยาที่ตรงกับเงื่อนไข</div>';
    return;
  }

  container.innerHTML = "";
  results.forEach(d=>{
    const accent = categoryMeta[d.category].accent;
    const card = document.createElement("div");
    card.className = "drug-card";
    card.style.setProperty("--card-accent", accent.includes("var") ? getComputedStyle(document.documentElement).getPropertyValue(accent.match(/--[\w-]+/)[0]) : accent);
    card.innerHTML =
      '<div class="card-top">' +
        '<div>' +
          '<h3>'+d.name+'</h3>' +
          '<span class="tag">'+d.class+'</span>' + settingBadgeHTML(d.setting) +
        '</div>' +
        '<button class="ud-btn">🔗 UpToDate</button>' +
      '</div>' +
      '<div class="card-body">' +
        '<p><strong>Max dose:</strong> '+d.maxDose+'</p>' +
        '<p><strong>Renal adjustment:</strong> '+d.renal+'</p>' +
      '</div>';
    card.querySelector(".ud-btn").addEventListener("click", ()=>{
      window.open(getUpToDateLink(d.name), "_blank");
    });
    container.appendChild(card);
  });
}

// ==================== SEARCH ====================
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearSearch");
searchInput.addEventListener("input", (e)=>{
  searchTerm = e.target.value;
  clearBtn.style.display = searchTerm ? "block" : "none";
  renderResults();
});
clearBtn.addEventListener("click", ()=>{
  searchTerm = "";
  searchInput.value = "";
  clearBtn.style.display = "none";
  renderResults();
});

// ==================== THEME TOGGLE ====================
const themeToggle = document.getElementById("themeToggle");
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("doseToolTheme", theme);
}
themeToggle.addEventListener("click", ()=>{
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
});
applyTheme(localStorage.getItem("doseToolTheme") || "light");

// ==================== INIT ====================
renderCategoryButtons();
renderSubsetChips();
renderResults();
</script>
</body>
</html>
